<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Listen Now</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 2rem; }
  </style>
</head>
<body>

  <h1>J&B – Don't Come Back</h1>
  <p>Redirecting to your preferred music app…</p>

  <script>
  (function() {
    const deepLinks = [
      // 1) Universal HTTPS link → opens Spotify app if installed
      'https://open.spotify.com/track/YOUR_TRACK_ID',
      // 2) If that somehow fails, try the custom URI schemes
      'itmss://itunes.apple.com/us/album/YOUR_ALBUM_ID?i=YOUR_TRACK_ID',
      'tidal://track/YOUR_TRACK_ID',
      'vnd.youtube://YOUR_TRACK_ID'
    ];
    const fallback = 'https://stream.jnbmusic.se/Dont-Come-Back';
    const delay = 1200;  // ms to wait before next attempt
    let tried = 0;
    let hidden = false;

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) hidden = true;
    });

    function attempt() {
      if (hidden) return;            // user left the page → success!
      if (tried >= deepLinks.length) {
        // nothing opened → final fallback
        window.location = fallback;
        return;
      }
      // jump to the next link
      window.location = deepLinks[tried++];
      // if page is still visible after `delay`, try again
      setTimeout(attempt, delay);
    }

    // start the sequence
    attempt();
  })();
  </script>
</body>
</html>
