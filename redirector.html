<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Listen Now</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 2rem; }
  </style>
</head>
<body>

  <h1>J&B – Don't Come Back</h1>
  <p>Redirecting to your preferred music app…</p>

  <script>
    (function() {
      // List your deep-link URLs in order of priority:
      const deepLinks = [
        'spotify://track/6owYtfI3RCgVOOpuQioXLs',
        'tidal://track/YOUR_TRACK_ID',
        'itmss://itunes.apple.com/us/album/1811316288?i=1811316289',
        'vnd.youtube://cWzdnsIBUgs'
      ];

      let hasHidden = false;
      const timeout = 1500; // ms before next attempt

      // If the page loses visibility (browser switches to app), we assume success.
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          hasHidden = true;
        }
      });

      // Try each link in sequence until one “sticks”
      function tryLink(i) {
        if (i >= deepLinks.length) {
          return showFallback();
        }
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = deepLinks[i];
        document.body.appendChild(iframe);

        setTimeout(() => {
          document.body.removeChild(iframe);
          if (hasHidden) {
            // user was taken to app; we’re done
            return;
          } else {
            // try next link
            tryLink(i + 1);
          }
        }, timeout);
      }

      function showFallback() {
        // Redirect to fallback URL if no app was opened
        window.location.href = 'https://stream.jnbmusic.se/Dont-Come-Back';
      }

      // Start attempting deep-links
      tryLink(0);

      // Backup redirect if everything else fails
      setTimeout(() => {
        if (!hasHidden) showFallback();
      }, deepLinks.length * timeout + 500);
    })();
  </script>

</body>
</html>
