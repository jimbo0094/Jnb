<body>
  <h1>Your Artist – New Single</h1>
  <button id="playBtn" style="font-size:1.2rem;padding:1rem;">
    ▶ Listen Now
  </button>

  <script>
    document.getElementById('playBtn').addEventListener('click', () => {
      // Try the universal link first
      window.location = 'https://open.spotify.com/track/YOUR_TRACK_ID';
      // After 1s, fallback to landing if app didn’t open
      setTimeout(() => {
        window.location = 'https://stream.jnbmusic.se/Dont-Come-Back';
      }, 1000);
    });
  </script>
</body>
